<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>job queue</title>
<style>
  :root{
    --bg: #0B0E14;
    --panel: #12161F;
    --border: #232A36;
    --text: #E6EDF3;
    --text-dim: #6E7A8A;
    --queued: #58A6FF;
    --running: #F2A93B;
    --done: #3FB950;
    --failed: #F85149;
    --interrupted: #A371F7;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:20px 28px;
    border-bottom:1px solid var(--border);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--mono);
    font-size:15px;
    letter-spacing:0.02em;
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--done);
    box-shadow:0 0 0 0 rgba(63,185,80,0.6);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(63,185,80,0.5); }
    70%{ box-shadow:0 0 0 8px rgba(63,185,80,0); }
    100%{ box-shadow:0 0 0 0 rgba(63,185,80,0); }
  }
  .queue-depth{
    font-family:var(--mono);
    font-size:13px;
    color:var(--text-dim);
  }
  .queue-depth b{ color:var(--text); }

  main{
    max-width:960px;
    margin:0 auto;
    padding:32px 28px 80px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }

  .upload-form{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field-label{
    font-family:var(--mono);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-dim);
  }
  .field-label .opt{ text-transform:none; letter-spacing:0; color:var(--text-dim); }
  select#template-select{
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    font-family:var(--sans);
    font-size:14px;
    cursor:pointer;
  }
  select#template-select:focus{ outline:1px solid var(--queued); }
  .slot{
    border:1px dashed var(--border);
    border-radius:8px;
    padding:16px 14px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    cursor:pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .slot.drag{
    border-color:var(--queued);
    background:rgba(88,166,255,0.06);
    color:var(--text);
  }
  .slot.filled{
    border-style:solid;
    border-color:var(--done);
    color:var(--text);
    font-family:var(--mono);
    font-size:12.5px;
  }
  .slot-input{ display:none; }
  .submit-btn{
    align-self:flex-start;
    background:var(--queued);
    color:#0B0E14;
    border:none;
    border-radius:8px;
    padding:10px 22px;
    font-family:var(--mono);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .submit-btn:disabled{
    background:var(--border);
    color:var(--text-dim);
    cursor:not-allowed;
  }
  .upload-error{
    color:var(--failed);
    font-size:12.5px;
    font-family:var(--mono);
    min-height:1em;
  }

  .section-label{
    font-family:var(--mono);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:var(--text-dim);
    margin-bottom:10px;
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  thead th{
    text-align:left;
    font-family:var(--mono);
    font-weight:400;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-dim);
    padding:0 12px 10px;
    border-bottom:1px solid var(--border);
  }
  tbody tr{
    cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  tbody tr:hover{ background:rgba(255,255,255,0.02); }
  tbody td{
    padding:12px;
    vertical-align:middle;
  }
  .fname{
    font-family:var(--mono);
    font-size:12.5px;
  }
  .fname.dim{ color:var(--text-dim); }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:var(--mono);
    font-size:11px;
    padding:3px 8px;
    border-radius:20px;
    border:1px solid currentColor;
  }
  .badge.queued{ color:var(--queued); }
  .badge.running{ color:var(--running); }
  .badge.done{ color:var(--done); }
  .badge.failed{ color:var(--failed); }
  .badge.interrupted{ color:var(--interrupted); }
  .badge .bdot{ width:5px; height:5px; border-radius:50%; background:currentColor; }
  .badge.running .bdot{ animation: pulse-run 1.2s infinite; }
  @keyframes pulse-run{ 0%,100%{opacity:1;} 50%{opacity:.3;} }

  .time-cell{ color:var(--text-dim); font-family:var(--mono); font-size:12px; }

  .empty{
    text-align:center;
    padding:40px 0;
    color:var(--text-dim);
    font-size:13px;
  }

  .log-row td{
    background:#0A0D13;
    padding:0;
  }
  pre.log{
    margin:0;
    padding:16px;
    font-family:var(--mono);
    font-size:11.5px;
    line-height:1.5;
    color:#9FB0C3;
    white-space:pre-wrap;
    word-break:break-all;
    max-height:320px;
    overflow-y:auto;
  }
  .del-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--text-dim);
    border-radius:6px;
    font-family:var(--mono);
    font-size:11px;
    padding:3px 8px;
    cursor:pointer;
  }
  .del-btn:hover{ border-color:var(--failed); color:var(--failed); }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span> job queue</div>
  <div class="queue-depth">대기 <b id="pending-count">0</b>건</div>
</header>

<main>
  <div>
    <div class="section-label">새 작업 추가</div>
    <div class="upload-form">
      <div class="field">
        <label class="field-label" for="template-select">템플릿</label>
        <select id="template-select"></select>
      </div>

      <div class="field" id="script-field" style="display:none;">
        <label class="field-label">스크립트 (.py)</label>
        <div class="slot" id="script-slot">.py 파일을 끌어다 놓거나 클릭</div>
        <input type="file" class="slot-input" id="script-input" accept=".py">
      </div>

      <div class="field">
        <label class="field-label">워크플로우 (.json) <span class="opt">— 필수</span></label>
        <div class="slot" id="workflow-slot">.json 파일을 끌어다 놓거나 클릭</div>
        <input type="file" class="slot-input" id="workflow-input" accept=".json">
      </div>

      <div class="field" id="csv-field" style="display:none;">
        <label class="field-label">CSV <span class="opt">— 이 템플릿에 필수</span></label>
        <div class="slot" id="csv-slot">.csv 파일을 끌어다 놓거나 클릭</div>
        <input type="file" class="slot-input" id="csv-input" accept=".csv">
      </div>

      <div>
        <button class="submit-btn" id="submit-btn">큐에 추가</button>
        <div class="upload-error" id="upload-error"></div>
      </div>
    </div>
  </div>

  <div>
    <div class="section-label">작업 목록</div>
    <table>
      <thead>
        <tr>
          <th style="width:26px;"></th>
          <th>파일</th>
          <th>템플릿</th>
          <th>워크플로우</th>
          <th>상태</th>
          <th>대기 등록</th>
          <th>시작</th>
          <th>종료</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="job-rows"></tbody>
    </table>
    <div class="empty" id="empty-msg" style="display:none;">아직 등록된 작업이 없어요</div>
  </div>
</main>

<script>
const STATUS_LABEL = {
  queued: "대기중", running: "실행중", done: "완료",
  failed: "실패", interrupted: "중단됨"
};

let expandedId = null;

function fmtTime(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleTimeString('ko-KR', {hour12:false});
}

async function fetchJobs(){
  const res = await fetch('/api/jobs');
  const data = await res.json();
  render(data.jobs, data.pending_count);
}

function render(jobs, pendingCount){
  document.getElementById('pending-count').textContent = pendingCount;
  const tbody = document.getElementById('job-rows');
  const emptyMsg = document.getElementById('empty-msg');

  if(jobs.length === 0){
    tbody.innerHTML = '';
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  tbody.innerHTML = jobs.map(j => {
    const isOpen = expandedId === j.id;
    let rows = `
      <tr data-id="${j.id}" class="job-row">
        <td>${isOpen ? '▾' : '▸'}</td>
        <td class="fname">${j.script_display_name}</td>
        <td class="fname${j.template_label ? '' : ' dim'}">${j.template_label || '커스텀'}</td>
        <td class="fname${j.workflow_original_name ? '' : ' dim'}">${j.workflow_original_name || '-'}</td>
        <td><span class="badge ${j.status}"><span class="bdot"></span>${STATUS_LABEL[j.status] || j.status}</span></td>
        <td class="time-cell">${fmtTime(j.queued_at)}</td>
        <td class="time-cell">${fmtTime(j.started_at)}</td>
        <td class="time-cell">${fmtTime(j.finished_at)}</td>
        <td>${j.status !== 'running' ? `<button class="del-btn" data-del="${j.id}">삭제</button>` : ''}</td>
      </tr>`;
    if(isOpen){
      rows += `<tr class="log-row"><td colspan="9"><pre class="log" id="log-${j.id}">불러오는 중…</pre></td></tr>`;
    }
    return rows;
  }).join('');

  tbody.querySelectorAll('.job-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if(e.target.closest('.del-btn')) return;
      const id = row.dataset.id;
      expandedId = expandedId === id ? null : id;
      render(jobs, pendingCount);
      if(expandedId) loadLog(expandedId);
    });
  });

  tbody.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await fetch('/api/jobs/' + btn.dataset.del, { method: 'DELETE' });
      fetchJobs();
    });
  });
}

async function loadLog(id){
  const res = await fetch(`/api/jobs/${id}/log`);
  const data = await res.json();
  const el = document.getElementById('log-' + id);
  if(el) el.textContent = data.log || '(아직 출력이 없어요)';
}

const CUSTOM_TEMPLATE_ID = '__custom__';
let templatesById = {};
let selectedFiles = { script: null, workflow: null, csv: null };

function setupSlot(slotId, inputId, key, accept){
  const slot = document.getElementById(slotId);
  const input = document.getElementById(inputId);
  const placeholder = slot.textContent;

  function setFile(file){
    selectedFiles[key] = file || null;
    if(file){
      slot.textContent = file.name;
      slot.classList.add('filled');
    } else {
      slot.textContent = placeholder;
      slot.classList.remove('filled');
    }
  }

  slot.addEventListener('click', () => input.click());
  input.addEventListener('change', (e) => setFile(e.target.files[0]));
  ['dragenter','dragover'].forEach(evt =>
    slot.addEventListener(evt, (e) => { e.preventDefault(); slot.classList.add('drag'); })
  );
  ['dragleave','drop'].forEach(evt =>
    slot.addEventListener(evt, (e) => { e.preventDefault(); slot.classList.remove('drag'); })
  );
  slot.addEventListener('drop', (e) => {
    const dropped = e.dataTransfer.files[0];
    if(dropped && dropped.name.toLowerCase().endsWith(accept)) setFile(dropped);
  });

  return setFile;
}

const setScriptFile = setupSlot('script-slot', 'script-input', 'script', '.py');
const setWorkflowFile = setupSlot('workflow-slot', 'workflow-input', 'workflow', '.json');
const setCsvFile = setupSlot('csv-slot', 'csv-input', 'csv', '.csv');

function resetForm(){
  setScriptFile(null);
  setWorkflowFile(null);
  setCsvFile(null);
}

const templateSelect = document.getElementById('template-select');
const scriptField = document.getElementById('script-field');
const csvField = document.getElementById('csv-field');
const uploadError = document.getElementById('upload-error');

function onTemplateChange(){
  const isCustom = templateSelect.value === CUSTOM_TEMPLATE_ID;
  const template = templatesById[templateSelect.value];
  scriptField.style.display = isCustom ? '' : 'none';
  csvField.style.display = (!isCustom && template && template.requires_csv) ? '' : 'none';
  uploadError.textContent = '';
}

async function fetchTemplates(){
  const res = await fetch('/api/templates');
  const list = await res.json();
  templatesById = {};
  templateSelect.innerHTML = '';
  for(const t of list){
    templatesById[t.id] = t;
    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = t.label;
    templateSelect.appendChild(opt);
  }
  const customOpt = document.createElement('option');
  customOpt.value = CUSTOM_TEMPLATE_ID;
  customOpt.textContent = '커스텀 py 업로드';
  templateSelect.appendChild(customOpt);
  onTemplateChange();
}

templateSelect.addEventListener('change', onTemplateChange);

document.getElementById('submit-btn').addEventListener('click', async () => {
  uploadError.textContent = '';
  const templateId = templateSelect.value;
  const isCustom = templateId === CUSTOM_TEMPLATE_ID;
  const template = templatesById[templateId];

  if(isCustom && !selectedFiles.script){
    uploadError.textContent = '커스텀 스크립트(.py)를 선택해주세요.';
    return;
  }
  if(!selectedFiles.workflow){
    uploadError.textContent = '워크플로우(.json)는 필수예요.';
    return;
  }
  if(!isCustom && template && template.requires_csv && !selectedFiles.csv){
    uploadError.textContent = '이 템플릿은 csv 파일이 필요해요.';
    return;
  }

  const form = new FormData();
  form.append('template_id', templateId);
  form.append('workflow', selectedFiles.workflow);
  if(isCustom) form.append('file', selectedFiles.script);
  if(!isCustom && template && template.requires_csv) form.append('csv', selectedFiles.csv);

  const res = await fetch('/api/upload', { method: 'POST', body: form });
  if(!res.ok){
    const data = await res.json().catch(() => ({}));
    uploadError.textContent = data.detail || '업로드에 실패했어요.';
    return;
  }
  resetForm();
  fetchJobs();
});

fetchTemplates();
fetchJobs();
setInterval(fetchJobs, 2000);
setInterval(() => { if(expandedId) loadLog(expandedId); }, 2000);
</script>
</body>
</html>
