<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>job queue</title>
<style>
  :root{
    --bg: #F7F8FA;
    --panel: #FFFFFF;
    --border: #E3E6EB;
    --text: #1B1F24;
    --text-dim: #6B7280;
    --log-text: #475467;
    --queued: #2563EB; --queued-rgb: 37,99,235;
    --running: #B45309; --running-rgb: 180,83,9;
    --done: #15803D; --done-rgb: 21,128,61;
    --failed: #DC2626; --failed-rgb: 220,38,38;
    --interrupted: #7C3AED; --interrupted-rgb: 124,58,237;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, Consolas, monospace;
    --sans: 'Inter', -apple-system, sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
  }
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 28px;
    background:var(--panel);
    border-bottom:1px solid var(--border);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:var(--mono);
    font-size:15px;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--done);
    box-shadow:0 0 0 0 rgba(var(--done-rgb),0.5);
    animation:pulse 2s infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(var(--done-rgb),0.45); }
    70%{ box-shadow:0 0 0 8px rgba(var(--done-rgb),0); }
    100%{ box-shadow:0 0 0 0 rgba(var(--done-rgb),0); }
  }
  .queue-depth{
    font-family:var(--mono);
    font-size:13px;
    color:var(--text-dim);
  }
  .queue-depth b{ color:var(--text); }

  .header-right{
    display:flex;
    align-items:center;
    gap:16px;
  }
  .comfy-status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:var(--mono);
    font-size:11.5px;
    font-weight:600;
    padding:4px 10px;
    border-radius:20px;
    border:1px solid var(--border);
    color:var(--text-dim);
  }
  .comfy-status .cdot{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .comfy-status.connected{ color:var(--done); border-color:currentColor; background:rgba(var(--done-rgb),0.08); }
  .comfy-status.disconnected{ color:var(--failed); border-color:currentColor; background:rgba(var(--failed-rgb),0.08); }

  main{
    max-width:1040px;
    margin:0 auto;
    padding:32px 28px 80px;
    display:flex;
    flex-direction:column;
    gap:24px;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:24px;
    box-shadow: 0 1px 2px rgba(16,24,40,0.04), 0 1px 3px rgba(16,24,40,0.03);
  }

  .upload-form{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  .field{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .field-label{
    font-family:var(--mono);
    font-size:11px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--text-dim);
  }
  .field-label .opt{ text-transform:none; letter-spacing:0; font-weight:400; color:var(--text-dim); }
  .options-fields{
    display:flex;
    flex-direction:column;
    gap:16px;
  }
  select#template-select,
  input.option-input{
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:10px 12px;
    font-family:var(--sans);
    font-size:14px;
    cursor:pointer;
  }
  input.option-input{ cursor:text; max-width:220px; }
  select#template-select:focus,
  input.option-input:focus{ outline:2px solid rgba(var(--queued-rgb),0.35); border-color:var(--queued); }
  .slot{
    border:1px dashed var(--border);
    background:var(--bg);
    border-radius:8px;
    padding:16px 14px;
    text-align:center;
    color:var(--text-dim);
    font-size:13px;
    cursor:pointer;
    transition: border-color .15s, background .15s, color .15s;
  }
  .slot.drag{
    border-color:var(--queued);
    background:rgba(var(--queued-rgb),0.06);
    color:var(--text);
  }
  .slot.filled{
    border-style:solid;
    border-color:var(--done);
    background:rgba(var(--done-rgb),0.05);
    color:var(--text);
    font-family:var(--mono);
    font-size:12.5px;
  }
  .slot-input{ display:none; }
  .submit-btn{
    align-self:flex-start;
    background:var(--queued);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:10px 22px;
    font-family:var(--mono);
    font-size:13px;
    font-weight:600;
    cursor:pointer;
  }
  .submit-btn:hover{ background:#1D4ED8; }
  .submit-btn:disabled{
    background:var(--border);
    color:var(--text-dim);
    cursor:not-allowed;
  }
  .upload-error{
    color:var(--failed);
    font-size:12.5px;
    font-family:var(--mono);
    min-height:1em;
  }

  .section-label{
    font-family:var(--mono);
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-dim);
    margin-bottom:16px;
  }

  table{
    width:100%;
    border-collapse:collapse;
    font-size:13px;
  }
  thead th{
    text-align:left;
    font-family:var(--mono);
    font-weight:600;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.05em;
    color:var(--text-dim);
    padding:0 12px 10px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
  }
  tbody tr{
    cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  tbody tr:last-child{ border-bottom:none; }
  tbody tr:hover{ background:var(--bg); }
  tbody td{
    padding:12px;
    vertical-align:middle;
  }
  .fname{
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--text);
  }
  .fname.dim{ color:var(--text-dim); }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-family:var(--mono);
    font-size:11px;
    font-weight:600;
    padding:3px 9px;
    border-radius:20px;
    border:1px solid currentColor;
  }
  .badge.queued{ color:var(--queued); background:rgba(var(--queued-rgb),0.10); }
  .badge.running{ color:var(--running); background:rgba(var(--running-rgb),0.10); }
  .badge.done{ color:var(--done); background:rgba(var(--done-rgb),0.10); }
  .badge.failed{ color:var(--failed); background:rgba(var(--failed-rgb),0.10); }
  .badge.interrupted{ color:var(--interrupted); background:rgba(var(--interrupted-rgb),0.10); }
  .badge .bdot{ width:5px; height:5px; border-radius:50%; background:currentColor; }
  .badge.running .bdot{ animation: pulse-run 1.2s infinite; }
  @keyframes pulse-run{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  .time-cell{ color:var(--text-dim); font-family:var(--mono); font-size:12px; }

  .empty{
    text-align:center;
    padding:40px 0;
    color:var(--text-dim);
    font-size:13px;
  }

  .log-row td{
    background:var(--bg);
    padding:0;
  }
  pre.log{
    margin:0;
    padding:16px;
    font-family:var(--mono);
    font-size:11.5px;
    line-height:1.5;
    color:var(--log-text);
    white-space:pre-wrap;
    word-break:break-all;
    max-height:320px;
    overflow-y:auto;
  }
  .del-btn{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    border-radius:6px;
    font-family:var(--mono);
    font-size:11px;
    padding:3px 8px;
    cursor:pointer;
  }
  .del-btn:hover{ border-color:var(--failed); color:var(--failed); background:rgba(var(--failed-rgb),0.06); }
  .row-actions{ display:flex; gap:6px; }
  .edit-btn{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    border-radius:6px;
    font-family:var(--mono);
    font-size:11px;
    padding:3px 8px;
    cursor:pointer;
  }
  .edit-btn:hover{ border-color:var(--queued); color:var(--queued); background:rgba(var(--queued-rgb),0.06); }

  .modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(17,24,39,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:50;
  }
  .modal-panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow: 0 8px 24px rgba(16,24,40,0.18);
    width:100%;
    max-width:720px;
    max-height:85vh;
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-bottom:1px solid var(--border);
  }
  .modal-title{
    font-family:var(--mono);
    font-size:13px;
    font-weight:600;
    color:var(--text);
  }
  .modal-close{
    background:none;
    border:none;
    cursor:pointer;
    color:var(--text-dim);
    font-size:20px;
    line-height:1;
    padding:4px;
  }
  .modal-close:hover{ color:var(--text); }
  .modal-body{
    padding:16px 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
    overflow:auto;
  }
  .workflow-textarea{
    width:100%;
    min-height:380px;
    resize:vertical;
    font-family:var(--mono);
    font-size:12.5px;
    line-height:1.5;
    color:var(--text);
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px;
    tab-size:2;
  }
  .workflow-textarea:focus{ outline:2px solid rgba(var(--queued-rgb),0.35); border-color:var(--queued); }
  .workflow-textarea.invalid{ border-color:var(--failed); }
  .workflow-error{
    color:var(--failed);
    font-family:var(--mono);
    font-size:12px;
    min-height:1.2em;
  }
  .modal-footer{
    display:flex;
    justify-content:flex-end;
    gap:10px;
    padding:14px 20px;
    border-top:1px solid var(--border);
  }
  .modal-btn-secondary{
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text-dim);
    border-radius:8px;
    padding:8px 16px;
    font-family:var(--mono);
    font-size:12.5px;
    cursor:pointer;
  }
  .modal-btn-secondary:hover{ border-color:var(--text-dim); color:var(--text); }
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span> job queue</div>
  <div class="header-right">
    <div class="comfy-status" id="comfy-status"><span class="cdot"></span><span id="comfy-status-text">ComfyUI 확인 중…</span></div>
    <div class="queue-depth">대기 <b id="pending-count">0</b>건</div>
  </div>
</header>

<main>
  <div class="panel">
    <div class="section-label">새 작업 추가</div>
    <div class="upload-form">
      <div class="field">
        <label class="field-label" for="template-select">템플릿</label>
        <select id="template-select"></select>
      </div>

      <div class="options-fields" id="options-fields"></div>

      <div class="field">
        <label class="field-label">워크플로우 (.json) <span class="opt">— 필수</span></label>
        <div class="slot" id="workflow-slot">.json 파일을 끌어다 놓거나 클릭</div>
        <input type="file" class="slot-input" id="workflow-input" accept=".json">
      </div>

      <div class="field" id="csv-field" style="display:none;">
        <label class="field-label">CSV <span class="opt">— 이 템플릿에 필수</span></label>
        <div class="slot" id="csv-slot">.csv 파일을 끌어다 놓거나 클릭</div>
        <input type="file" class="slot-input" id="csv-input" accept=".csv">
      </div>

      <div>
        <button class="submit-btn" id="submit-btn">큐에 추가</button>
        <div class="upload-error" id="upload-error"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="section-label">작업 목록</div>
    <table>
      <thead>
        <tr>
          <th style="width:26px;"></th>
          <th>템플릿</th>
          <th>옵션</th>
          <th>워크플로우</th>
          <th>상태</th>
          <th>대기 등록</th>
          <th>시작</th>
          <th>종료</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="job-rows"></tbody>
    </table>
    <div class="empty" id="empty-msg" style="display:none;">아직 등록된 작업이 없어요</div>
  </div>
</main>

<div class="modal-overlay" id="workflow-modal" style="display:none;">
  <div class="modal-panel">
    <div class="modal-header">
      <div class="modal-title" id="workflow-modal-title">워크플로우 수정</div>
      <button class="modal-close" id="workflow-modal-close" aria-label="닫기">&times;</button>
    </div>
    <div class="modal-body">
      <textarea class="workflow-textarea" id="workflow-editor" spellcheck="false"></textarea>
      <div class="workflow-error" id="workflow-editor-error"></div>
    </div>
    <div class="modal-footer">
      <button class="modal-btn-secondary" id="workflow-cancel-btn">취소</button>
      <button class="submit-btn" id="workflow-save-btn">저장</button>
    </div>
  </div>
</div>

<script>
const STATUS_LABEL = {
  queued: "대기중", running: "실행중", done: "완료",
  failed: "실패", interrupted: "중단됨"
};

let expandedId = null;

function fmtTime(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleTimeString('ko-KR', {hour12:false});
}

function fmtOptions(options){
  const entries = Object.entries(options || {});
  if(entries.length === 0) return '-';
  return entries.map(([k, v]) => `${k}=${v}`).join(', ');
}

async function fetchJobs(){
  const res = await fetch('/api/jobs');
  const data = await res.json();
  render(data.jobs, data.pending_count);
}

function render(jobs, pendingCount){
  document.getElementById('pending-count').textContent = pendingCount;
  const tbody = document.getElementById('job-rows');
  const emptyMsg = document.getElementById('empty-msg');

  if(jobs.length === 0){
    tbody.innerHTML = '';
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  tbody.innerHTML = jobs.map(j => {
    const isOpen = expandedId === j.id;
    let rows = `
      <tr data-id="${j.id}" class="job-row">
        <td>${isOpen ? '▾' : '▸'}</td>
        <td class="fname">${j.template_label || j.template_id}</td>
        <td class="fname${Object.keys(j.options || {}).length ? '' : ' dim'}">${fmtOptions(j.options)}</td>
        <td class="fname${j.workflow_original_name ? '' : ' dim'}">${j.workflow_original_name || '-'}</td>
        <td><span class="badge ${j.status}"><span class="bdot"></span>${STATUS_LABEL[j.status] || j.status}</span></td>
        <td class="time-cell">${fmtTime(j.queued_at)}</td>
        <td class="time-cell">${fmtTime(j.started_at)}</td>
        <td class="time-cell">${fmtTime(j.finished_at)}</td>
        <td>
          <div class="row-actions">
            ${j.status === 'queued' ? `<button class="edit-btn" data-editwf="${j.id}">워크플로우 수정</button>` : ''}
            ${j.status !== 'running' ? `<button class="del-btn" data-del="${j.id}">삭제</button>` : ''}
          </div>
        </td>
      </tr>`;
    if(isOpen){
      rows += `<tr class="log-row"><td colspan="9"><pre class="log" id="log-${j.id}">불러오는 중…</pre></td></tr>`;
    }
    return rows;
  }).join('');

  tbody.querySelectorAll('.job-row').forEach(row => {
    row.addEventListener('click', (e) => {
      if(e.target.closest('.del-btn')) return;
      const id = row.dataset.id;
      expandedId = expandedId === id ? null : id;
      render(jobs, pendingCount);
      if(expandedId) loadLog(expandedId);
    });
  });

  tbody.querySelectorAll('.del-btn').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      await fetch('/api/jobs/' + btn.dataset.del, { method: 'DELETE' });
      fetchJobs();
    });
  });

  tbody.querySelectorAll('.edit-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      openWorkflowEditor(btn.dataset.editwf);
    });
  });
}

async function loadLog(id){
  const res = await fetch(`/api/jobs/${id}/log`);
  const data = await res.json();
  const el = document.getElementById('log-' + id);
  if(el) el.textContent = data.log || '(아직 출력이 없어요)';
}

let templatesById = {};
let selectedFiles = { workflow: null, csv: null };

function setupSlot(slotId, inputId, key, accept){
  const slot = document.getElementById(slotId);
  const input = document.getElementById(inputId);
  const placeholder = slot.textContent;

  function setFile(file){
    selectedFiles[key] = file || null;
    if(file){
      slot.textContent = file.name;
      slot.classList.add('filled');
    } else {
      slot.textContent = placeholder;
      slot.classList.remove('filled');
    }
  }

  slot.addEventListener('click', () => input.click());
  input.addEventListener('change', (e) => setFile(e.target.files[0]));
  ['dragenter','dragover'].forEach(evt =>
    slot.addEventListener(evt, (e) => { e.preventDefault(); slot.classList.add('drag'); })
  );
  ['dragleave','drop'].forEach(evt =>
    slot.addEventListener(evt, (e) => { e.preventDefault(); slot.classList.remove('drag'); })
  );
  slot.addEventListener('drop', (e) => {
    const dropped = e.dataTransfer.files[0];
    if(dropped && dropped.name.toLowerCase().endsWith(accept)) setFile(dropped);
  });

  return setFile;
}

const setWorkflowFile = setupSlot('workflow-slot', 'workflow-input', 'workflow', '.json');
const setCsvFile = setupSlot('csv-slot', 'csv-input', 'csv', '.csv');

function resetForm(){
  setWorkflowFile(null);
  setCsvFile(null);
}

const templateSelect = document.getElementById('template-select');
const optionsFields = document.getElementById('options-fields');
const csvField = document.getElementById('csv-field');
const uploadError = document.getElementById('upload-error');

function renderOptionFields(template){
  optionsFields.innerHTML = '';
  for(const opt of (template ? template.options || [] : [])){
    const field = document.createElement('div');
    field.className = 'field';

    const label = document.createElement('label');
    label.className = 'field-label';
    label.textContent = opt.label;

    const input = document.createElement('input');
    input.className = 'option-input';
    input.type = opt.type === 'number' ? 'number' : 'text';
    input.dataset.name = opt.name;
    if(opt.default !== undefined && opt.default !== null) input.value = opt.default;

    field.appendChild(label);
    field.appendChild(input);
    optionsFields.appendChild(field);
  }
}

function onTemplateChange(){
  const template = templatesById[templateSelect.value];
  csvField.style.display = (template && template.requires_csv) ? '' : 'none';
  renderOptionFields(template);
  uploadError.textContent = '';
}

async function fetchTemplates(){
  const res = await fetch('/api/templates');
  const list = await res.json();
  templatesById = {};
  templateSelect.innerHTML = '';
  for(const t of list){
    templatesById[t.id] = t;
    const opt = document.createElement('option');
    opt.value = t.id;
    opt.textContent = t.label;
    templateSelect.appendChild(opt);
  }
  onTemplateChange();
}

templateSelect.addEventListener('change', onTemplateChange);

document.getElementById('submit-btn').addEventListener('click', async () => {
  uploadError.textContent = '';
  const templateId = templateSelect.value;
  const template = templatesById[templateId];

  if(!selectedFiles.workflow){
    uploadError.textContent = '워크플로우(.json)는 필수예요.';
    return;
  }
  if(template && template.requires_csv && !selectedFiles.csv){
    uploadError.textContent = '이 템플릿은 csv 파일이 필요해요.';
    return;
  }

  const form = new FormData();
  form.append('template_id', templateId);
  form.append('workflow', selectedFiles.workflow);
  if(template && template.requires_csv) form.append('csv', selectedFiles.csv);
  optionsFields.querySelectorAll('.option-input').forEach(input => {
    form.append(input.dataset.name, input.value);
  });

  const res = await fetch('/api/upload', { method: 'POST', body: form });
  if(!res.ok){
    const data = await res.json().catch(() => ({}));
    uploadError.textContent = data.detail || '업로드에 실패했어요.';
    return;
  }
  resetForm();
  fetchJobs();
});

async function fetchComfyStatus(){
  const el = document.getElementById('comfy-status');
  const text = document.getElementById('comfy-status-text');
  let data;
  try{
    const res = await fetch('/api/comfy-status');
    data = await res.json();
  }catch(e){
    data = { url: null, connected: false };
  }
  el.classList.remove('connected', 'disconnected');
  if(data.connected){
    el.classList.add('connected');
    text.textContent = `ComfyUI 연결됨 · ${data.url}`;
  } else {
    el.classList.add('disconnected');
    text.textContent = data.url ? `ComfyUI 연결 안 됨 · ${data.url}` : 'ComfyUI 연결 안 됨';
  }
}

let editingJobId = null;
const workflowModal = document.getElementById('workflow-modal');
const workflowEditor = document.getElementById('workflow-editor');
const workflowEditorError = document.getElementById('workflow-editor-error');
const workflowSaveBtn = document.getElementById('workflow-save-btn');
const workflowModalTitle = document.getElementById('workflow-modal-title');

function computeLineCol(text, pos){
  const upto = text.slice(0, pos);
  const lines = upto.split('\n');
  return { line: lines.length, col: lines[lines.length - 1].length + 1 };
}

function validateWorkflowEditor(){
  const text = workflowEditor.value;
  try{
    JSON.parse(text);
    workflowEditor.classList.remove('invalid');
    workflowEditorError.textContent = '';
    workflowSaveBtn.disabled = false;
    return true;
  }catch(e){
    workflowEditor.classList.add('invalid');
    const lineColMatch = e.message.match(/line (\d+) column (\d+)/);
    const posMatch = e.message.match(/position (\d+)/);
    let where = '';
    if(lineColMatch){
      where = `${lineColMatch[1]}번째 줄, ${lineColMatch[2]}번째 열`;
    } else if(posMatch){
      const { line, col } = computeLineCol(text, Number(posMatch[1]));
      where = `${line}번째 줄, ${col}번째 열`;
    }
    workflowEditorError.textContent = where ? `${where} 근처에 JSON 문법 오류가 있어요.` : 'JSON 문법 오류가 있어요.';
    workflowSaveBtn.disabled = true;
    return false;
  }
}

async function openWorkflowEditor(jobId){
  editingJobId = jobId;
  workflowModalTitle.textContent = `워크플로우 수정 · ${jobId}`;
  workflowEditor.value = '불러오는 중…';
  workflowEditor.classList.remove('invalid');
  workflowEditorError.textContent = '';
  workflowSaveBtn.disabled = true;
  workflowModal.style.display = 'flex';

  try{
    const res = await fetch(`/api/jobs/${jobId}/workflow`);
    if(!res.ok){
      const data = await res.json().catch(() => ({}));
      workflowEditor.value = '';
      workflowEditorError.textContent = data.detail || '워크플로우를 불러오지 못했어요.';
      return;
    }
    workflowEditor.value = await res.text();
    validateWorkflowEditor();
  }catch(e){
    workflowEditor.value = '';
    workflowEditorError.textContent = '워크플로우를 불러오지 못했어요.';
  }
}

function closeWorkflowEditor(){
  workflowModal.style.display = 'none';
  editingJobId = null;
}

workflowEditor.addEventListener('input', validateWorkflowEditor);
document.getElementById('workflow-modal-close').addEventListener('click', closeWorkflowEditor);
document.getElementById('workflow-cancel-btn').addEventListener('click', closeWorkflowEditor);
workflowModal.addEventListener('click', (e) => { if(e.target === workflowModal) closeWorkflowEditor(); });
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && workflowModal.style.display !== 'none') closeWorkflowEditor();
});

workflowSaveBtn.addEventListener('click', async () => {
  if(!editingJobId || !validateWorkflowEditor()) return;
  workflowSaveBtn.disabled = true;
  try{
    const res = await fetch(`/api/jobs/${editingJobId}/workflow`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: workflowEditor.value,
    });
    if(!res.ok){
      const data = await res.json().catch(() => ({}));
      workflowEditorError.textContent = data.detail || '저장에 실패했어요.';
      workflowSaveBtn.disabled = false;
      return;
    }
    closeWorkflowEditor();
    fetchJobs();
  }catch(e){
    workflowEditorError.textContent = '저장에 실패했어요.';
    workflowSaveBtn.disabled = false;
  }
});

fetchTemplates();
fetchJobs();
fetchComfyStatus();
setInterval(fetchJobs, 2000);
setInterval(() => { if(expandedId) loadLog(expandedId); }, 2000);
setInterval(fetchComfyStatus, 5000);
</script>
</body>
